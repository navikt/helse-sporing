spec:
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: db-f1-micro
        diskAutoresize: true
        databases:
          - name: sporing
        flags:
          - name: cloudsql.enable_pgaudit
            value: "off"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  azure:
    application:
      tenant: trygdeetaten.no
  kafka:
    pool: nav-dev
  ingresses:
    - https://sporing.intern.dev.nav.no
    - https://sporing.ansatt.dev.nav.no
  env:
    - name: SPLEIS_SCOPE
      value: api://dev-gcp.tbd.spleis-api/.default
